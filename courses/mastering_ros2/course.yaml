id: mastering_ros2
title: Real-Time Robotics Systems with ROS 2
ros_distro: jazzy
description: 'From your first ROS 2 node to a deterministic, multi-host, fieldbus-connected robot cell: ROS 2 and
  ros2_control, Linux internals, PREEMPT_RT, DDS networking, industrial fieldbuses and deployment. Every lab runs
  real code; latency numbers come from real measurements.'
sources:
  mr2: Mastering ROS 2 for Robotics Programming, 4th ed. (Joseph & Cacace, 2025)
  lkp: Linux Kernel Programming, 2nd ed. (Billimoria, 2024)
  sp: Systems Performance, 2nd ed. (Gregg, 2020)
  ccia: C++ Concurrency in Action, 2nd ed. (Williams, 2019) — optional
  drepper: What Every Programmer Should Know About Memory (Drepper) — docs/reading
  odva: ODVA EtherNet/IP Technology Overview + CIP brochure — docs/reading
  rm0090: STM32F4 Reference Manual RM0090 (ST, free) — bxCAN, timers, ADC chapters
  emulica: Emulica MCU emulator (Embedded_claw/replica-server)
  docs: Free official documentation — links in docs/reading/README.md
