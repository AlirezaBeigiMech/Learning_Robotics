- original: "Chapter3/mastering_ros_robot_description_pkg: pan_tilt.urdf + view_pan_tilt_urdf.launch"
  ros1: catkin package, roslaunch with <param name="robot_description" textfile=...>, joint_state_publisher_gui, RViz
  ros2: ament_cmake description package installing urdf/ + launch/; XML launch running xacro via $(command ...) with type="str";
        robot_description as a robot_state_publisher PARAMETER (republished on the latched /robot_description topic);
        joint values from the academy's visible /academy_joint_gui node (joint_state_publisher_gui equivalent)
  changed_apis: [$(find pkg) → $(find-pkg-share pkg), <param textfile> → <param ... value="$(command 'xacro ...')" type="str"/>, node type= → exec=]
  changed_packages: [catkin → ament_cmake (project(... NONE), no compiler needed)]
  changed_configuration: [install(DIRECTORY urdf launch DESTINATION share/${PROJECT_NAME})]
  changed_behavior: [No global parameter server; TF from robot_state_publisher with KDL (root-link inertia ignored, warned)]
  lesson: ch03_pan_tilt
  status: Exercise Validated
  evidence: "scripts/validate_course.py ch03_pan_tilt (solution 10/10 incl. hidden; starter fails final; wrong-axis and visual-origin mutants rejected) + backend/tests/e2e_chapter3.py"

