# ROS 1 → ROS 2 migration registry (spec §17).
# status ∈ Not Started | Architecture Designed | Implemented | Builds Successfully | Runtime Validated | Exercise Validated
# A status above "Architecture Designed" is only recorded with `evidence`: the automated check that passed.
# Validation platform for statuses recorded here: Windows 11, RoboStack ROS 2 Jazzy (pixi), 2026-10-10.

- original: "Chapter2/mastering_ros_demo_pkg: demo_topic_publisher.cpp + demo_topic_subscriber.cpp"
  ros1: roscpp, ros::Rate + spinOnce loop, std_msgs/Int32 on /numbers at 10 Hz, ROS_INFO
  ros2: C++ rclcpp node (class deriving rclcpp::Node) with create_wall_timer(100ms) + create_publisher/create_subscription,
        rclcpp::spin executor, explicit QoS — the same language as the book's original example
  changed_apis: [ros::init → rclcpp::init, NodeHandle.advertise<T> → Node::create_publisher<T>, ros::Rate + spinOnce loop → create_wall_timer,
                 ros::Subscriber(callback) → create_subscription<T> returning a SharedPtr that must be kept, ROS_INFO → RCLCPP_INFO]
  changed_packages: [catkin → ament_cmake, roscpp → rclcpp]
  changed_configuration: [package.xml format 3 (ament_cmake), CMakeLists find_package + ament_target_dependencies + install(TARGETS) into lib/<pkg>;
                          built with Ninja + MSVC on Windows (Visual Studio generator fails on MAX_PATH)]
  changed_behavior: [No master; DDS discovery. QoS compatibility now decides whether data flows (taught in debugging lab)]
  lesson: ch02_pubsub
  status: Exercise Validated
  evidence: "scripts/validate_course.py ch02_pubsub (solution 10/10 incl. hidden; starter 0/10; BEST_EFFORT and 2 Hz mutants rejected) + backend/tests/e2e_workflow.py"

